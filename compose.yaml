# E-Rechnung Konverter – production-style setup, one service per concern.
#
#   frontend  nginx: web UI + reverse proxy for /api   (only published port)
#   backend   FastAPI                                   (internal only)
#   worker    SAP-IDoc + PDF inbox -> e-invoices        (no internet access)
#   db        PostgreSQL archive of all e-invoices      (internal only)
#   backup    daily pg_dump of the database             (no internet access)
#   ocr       OCRmyPDF/Tesseract for scanned PDFs       (no internet access)
#
# Network "web" connects frontend and backend; network "data" (internal, no
# internet) connects backend, worker and db. The frontend cannot reach the db.
#
# Start:  ./deploy.sh            (recommended: creates .env, folders, starts, checks)
#   or:   cp .env.example .env   (set POSTGRES_PASSWORD)
#         docker compose up -d --build
#         -> http://localhost:8080
#
# Optional overlays (set COMPOSE_FILE in .env, deploy.sh does this for you):
#   deploy/compose.https.yaml   bundled Caddy with automatic HTTPS (ports 80/443)
#   deploy/compose.proxy.yaml   behind an existing Docker reverse proxy (Traefik, NPM, nginx-proxy)

name: erechnung

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erechnung}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/${POSTGRES_DB:-erechnung}
  OCR_URL: http://ocr:8000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erechnung}
      POSTGRES_USER: ${POSTGRES_USER:-erechnung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  backend:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-erechnung}-backend:latest
    restart: unless-stopped
    environment:
      <<: *backend-env
      # first admin, created only while the user table is empty
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      IDOC_DIR: /data/idoc
      PDF_DIR: /data/pdf
    volumes:
      - ./backend/config:/app/config:ro  # company.yaml (own master data)
      - ${IDOC_HOST_DIR:-./data/idoc}:/data/idoc  # admin status page + "retry failed file"
      - ${PDF_HOST_DIR:-./data/pdf}:/data/pdf
    depends_on:
      db:
        condition: service_healthy
    networks: [web, data]

  worker:
    image: ${COMPOSE_PROJECT_NAME:-erechnung}-backend:latest  # same image as backend, different command
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      IDOC_DIR: /data/idoc
      PDF_DIR: /data/pdf
      IDOC_PROFILE: ${IDOC_PROFILE:-zugferd}
      IDOC_INTERVAL: ${IDOC_INTERVAL:-10}
    volumes:
      - ./backend/config:/app/config:ro
      - ${IDOC_HOST_DIR:-./data/idoc}:/data/idoc  # SAP writes into <dir>/inbox
      - ${PDF_HOST_DIR:-./data/pdf}:/data/pdf  # scanner / file share writes PDFs into <dir>/inbox
    healthcheck:  # healthy = a polling round finished within the last 60 s
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started  # backend builds the shared image
    networks: [data]

  backup:
    image: postgres:16-alpine  # same major version as db, so pg_dump matches
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-erechnung}
      PGUSER: ${POSTGRES_USER:-erechnung}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:  # healthy = a backup younger than 26 hours exists
      test: ["CMD-SHELL", "find /backups -name 'erechnung-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 2m
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  ocr:
    build: ./ocr
    image: ${COMPOSE_PROJECT_NAME:-erechnung}-ocr:latest
    restart: unless-stopped
    environment:
      OCR_LANG: ${OCR_LANG:-deu+eng}
      OCR_PARALLEL: ${OCR_PARALLEL:-2}
    networks: [data]

  frontend:
    build: ./frontend
    image: ${COMPOSE_PROJECT_NAME:-erechnung}-frontend:latest
    restart: unless-stopped
    ports:
      # HTTP_BIND=127.0.0.1 keeps the port local (e.g. behind a reverse proxy on the host)
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

networks:
  web: {}
  data:
    internal: true

volumes:
  pgdata: {}
