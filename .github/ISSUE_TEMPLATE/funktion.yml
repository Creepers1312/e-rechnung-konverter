name: Funktion vorschlagen
description: Idee für eine neue Funktion oder Verbesserung.
labels: [funktion]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
      description: Wer braucht das und in welcher Situation?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Vorschlag
    validations:
      required: true
  - type: dropdown
    id: rolle
    attributes:
      label: Für welche Rolle?
      options:
        - Benutzer (Umwandeln)
        - Administrator (Verwaltung)
        - Beide
        - Betrieb / IT
  - type: textarea
    id: alternativen
    attributes:
      label: Alternativen / Workarounds
