name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint, Format, Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest -q

  ocr:
    name: OCR-Dienst (Tesseract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng ghostscript
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr/requirements.txt
      - run: pip install -r requirements.txt pytest httpx pdfplumber reportlab ruff
      - run: ruff check --output-format=github . && ruff format --check .
      - run: pytest -q

  frontend:
    name: Frontend (Typecheck, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json  # pnpm version from "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: Docker (Compose-Konfiguration, Images bauen)
    runs-on: ubuntu-latest
    needs: [backend, frontend, ocr]
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Konfiguration prüfen (alle Betriebsarten)
        run: |
          cp .env.example .env
          printf 'DOMAIN=rechnung.example.de\nACME_EMAIL=it@example.de\nPROXY_NETWORK=proxy\n' >> .env
          for f in compose.yaml compose.yaml:deploy/compose.https.yaml compose.yaml:deploy/compose.proxy.yaml; do
            COMPOSE_FILE=$f docker compose config -q && echo "ok: $f"
          done
      - name: Shell-Skripte prüfen (shellcheck)
        run: shellcheck -S warning deploy.sh backup/backup.sh
      - name: Images bauen
        run: docker compose build
