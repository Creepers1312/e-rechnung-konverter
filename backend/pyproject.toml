[project]
name = "erechnung-backend"
version = "0.2.0"
description = "PDF / SAP ECC -> E-Rechnung (XRechnung, ZUGFeRD) converter backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "factur-x>=3.0",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "reportlab>=4.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["extraction/templates/*.yaml"]
