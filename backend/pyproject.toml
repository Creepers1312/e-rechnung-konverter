[project]
name = "erechnung-backend"
version = "0.2.0"
description = "PDF / SAP ECC -> E-Rechnung (XRechnung, ZUGFeRD) converter backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "factur-x>=3.0",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "reportlab>=4.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "tzdata>=2024.1",  # time zone for the start page figures (slim images may lack /usr/share/zoneinfo)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["extraction/templates/*.yaml", "handbuch/*.md", "handbuch/img/*.png"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
  "B008",  # FastAPI's Depends()/File() defaults are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # DATABASE_URL must be set before importing the app
