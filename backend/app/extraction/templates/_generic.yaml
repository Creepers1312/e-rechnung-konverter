# Generic rules for German invoices. Used for every PDF; a matching layout
# template (any other *.yaml in this folder) is merged on top of it, so a
# template only needs to list what differs.
#
# Placeholders usable inside patterns:
#   {AMOUNT}  German amount, e.g. 1.234,56
#   {DATE}    German date, e.g. 04.11.2026 or 04.11.26
# The first non-empty capture group of a field pattern is the value, so
# alternatives like '(a)|(b)' are fine.
# Patterns are case-insensitive and searched in the full PDF text.

id: _generic
name: Allgemeine Regeln (deutsche Rechnungen)

fields:
  # {SEP} = optional colon between label and value, never crossing a line break
  # (an empty field like "Kundennummer:" must not pick up the next line).
  number: 'Rechnungs?[- ]?(?:nummer|nr\.?)(?:[ \t]*/[ \t]*Datum)?{SEP}([A-Z0-9][A-Z0-9\-/_.]*)'
  issue_date: 'Rechnungsdatum{SEP}({DATE})|Rechnungs?[- ]?(?:nummer|nr\.?)[ \t]*/[ \t]*Datum{SEP}\S+[ \t]*/[ \t]*({DATE})|^[ \t]*Datum{SEP}({DATE})'
  delivery_date: '(?:Liefer|Leistungs)(?:datum|zeitpunkt){SEP}({DATE})|Liefer(?:schein)?[- ]?(?:Nr\.?|nummer)[ \t]*/[ \t]*Datum{SEP}[A-Z0-9\-]+[ \t]*/[ \t]*({DATE})'
  due_date: '(?:fällig|zahlbar)[ \t]+(?:am|bis(?:[ \t]+zum)?){SEP}({DATE})'
  # payment term in days, e.g. "30 Tage ohne Abzug", "zahlbar innerhalb von 14 Tagen";
  # the largest number found is used to compute the due date from the invoice date
  due_days: '(\d{1,3})[ \t]*Tage(?:n)?[ \t]+(?:netto|rein[ \t]+netto|ohne[ \t]+Abzug)|(?:innerhalb|binnen)[ \t]+(?:von[ \t]+)?(\d{1,3})[ \t]*Tage|netto[ \t]+(\d{1,3})[ \t]*Tage'
  order_reference: '(?:Bestell(?:nummer|nr\.?)|Ihre[ \t]+Bestellung(?:[ \t]*-?Nr\.?)?){SEP}([A-Z0-9][A-Z0-9\-/_.]*)'
  buyer_reference: 'Leitweg-?ID{SEP}([0-9A-Z][0-9A-Z\-]+)'
  buyer_erp_id: 'Kunden[- ]?(?:nummer|nr\.?){SEP}([A-Z0-9][A-Z0-9\-]*)'
  buyer_vat_id: '(?:Ihre|Kunden)[- ]?USt\.?[- ]?Id(?:ent)?\.?(?:[ \t]*Nr\.?)?{SEP}([A-Z]{2}[ \t]?[0-9A-Z]{8,12})'
  buyer_email: 'Rechnungs-?E-?Mail{SEP}(\S+@\S+)'
  terms: '(?:Zahlungsbedingung(?:en)?|Zahlungsziel){SEP}([^\n]+)|((?:Zahlbar|zahlbar)[^\n]*)'
  vat_rate: '(\d{1,2}(?:,\d+)?)[ \t]*%[ \t]*(?:MwSt|USt|Umsatzsteuer|Mehrwertsteuer)|(?:MwSt|USt|Umsatzsteuer|Mehrwertsteuer)\.?[ \t]*(\d{1,2}(?:,\d+)?)[ \t]*%'
  total_net: '(?:Netto(?:betrag|summe)?|Zwischensumme|Warenwert|Summe[ \t]+netto|Gesamt[ \t]+netto){SEP}({AMOUNT})'
  total_tax: '(?:MwSt|USt|Umsatzsteuer|Mehrwertsteuer)\.?(?:[ \t]+(?:Total|gesamt|Betrag))?(?:[ \t]*\d{1,2}(?:,\d+)?[ \t]*%)?{SEP}({AMOUNT})'
  total_gross: '(?:Brutto(?:betrag|summe)?|Gesamtbetrag|Rechnungsbetrag|Rechnungssumme|Endbetrag|Endsumme|Gesamtsumme|Zu[ \t]+zahlen){SEP}({AMOUNT})'
  # price unit from the table header, e.g. "Preis / 1000 KG", "Price / 100 KG" (BT-149; default 1)
  price_base: '(?:Preis|Price)[ \t]*/[ \t]*(\d+)[ \t]*(?:KG|TO|T|ST|STK|PC|M|L)\b'
  # tax-free deliveries: only applied when the invoice prints no tax
  export_hint: '(tax[ \t]+free[ \t]+export|steuerfreie[ \t]+Ausfuhr|Ausfuhrlieferung)'
  intra_eu_hint: '(innergemeinschaftliche[ \t]+Lieferung|intra-?community[ \t]+(?:supply|delivery))'

# Line items, between `start` and `end` (both optional). Either
#   pattern:        one item per text line (searched line by line), or
#   block_pattern:  one item spread over several lines (searched in the whole
#                   region; the `start` line is included), see rheinfelden-carbon.yaml.
# Named groups: name, quantity, unit_price (required); total, id, unit, vat_rate,
# article (seller's article/material number, BT-155) are optional.
lines:
  start: '^\s*Pos'
  end: '^\s*(?:Netto|Zwischensumme|Summe|Gesamt)'
  pattern: '^(?:(?P<id>\d{1,3})\s+)?(?P<name>.+?)\s+(?P<quantity>{NUMBER})\s*(?P<unit>Stk\.?|Stück|St\.|Std\.?|h|kg|m|l|Pauschal|psch\.?|x)?\s+(?P<unit_price>{AMOUNT})\s*(?:€|EUR)?\s+(?:(?P<vat_rate>\d{1,2})\s*%\s+)?(?P<total>{AMOUNT})\s*(?:€|EUR)?$'

# Map printed units to UN/ECE Rec 20 codes (case-insensitive, trailing dot ignored).
units:
  stk: H87
  stück: H87
  st: H87
  x: H87
  std: HUR
  h: HUR
  kg: KGM
  m: MTR
  l: LTR
  pauschal: LS
  psch: LS
  to: TNE
  t: TNE
  tonne: TNE
  tonnen: TNE

# Buyer address: the address window, in PDF points from the top-left of page 1
# (x0, top, x1, bottom). Generous on purpose: DIN 5008 puts it at 20 mm from the
# left, but many letterheads (e.g. SAP forms) start at ~15 mm – a too narrow box
# cuts off the first word of every line, including the postcode.
# The small return-address line ("Firma, Straße, PLZ Ort") is skipped.
buyer_region: [20, 110, 310, 270]

defaults:
  vat_rate: 19
  vat_category: S
